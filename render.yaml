services:
  # 1. FastAPI Web Service
  - type: web
    name: heavy-rag-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis-queue
          property: connectionString

  # 2. Background Worker Service
  - type: worker
    name: heavy-rag-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: "arq app.worker.WorkerSettings"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis-queue
          property: connectionString

  # 3. Redis Broker (Fixed with ipAllowList)
  - type: keyvalue
    name: agent-redis-queue
    region: oregon
    plan: free
    ipAllowList: [] # Strictly restricts access to internal services only